name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        config:
          - {name: GCC 13, os: ubuntu-24.04, cxx: g++-13}
          - {name: GCC 14, os: ubuntu-24.04, cxx: g++-14}
          - {name: Clang 18, os: ubuntu-24.04, cxx: clang++-18}
          - {name: Apple Clang, os: macos-15, cxx: clang++}
          - {name: MSVC, os: windows-2022, cxx: cl}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure (Linux and macOS)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}
          -DVARDIFF_BUILD_TESTS=ON -DVARDIFF_BUILD_EXAMPLES=ON
          -DVARDIFF_BUILD_BENCHMARKS=ON -DVARDIFF_WARNINGS_AS_ERRORS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DVARDIFF_BUILD_TESTS=ON -DVARDIFF_BUILD_EXAMPLES=ON
          -DVARDIFF_BUILD_BENCHMARKS=ON -DVARDIFF_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error

      - name: Install package
        run: cmake --install build --config ${{ matrix.build_type }} --prefix stage

      - name: Configure installed-package consumer (Linux and macOS)
        if: runner.os != 'Windows'
        run: >-
          cmake -S tests/consumer -B build-consumer -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}
          "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage"

      - name: Configure installed-package consumer (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S tests/consumer -B build-consumer
          -G "Visual Studio 17 2022" -A x64
          "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage"

      - name: Build installed-package consumer
        run: cmake --build build-consumer --config ${{ matrix.build_type }} --parallel 2

      - name: Test installed-package consumer
        run: ctest --test-dir build-consumer -C ${{ matrix.build_type }} --output-on-failure --no-tests=error

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14 -DVARDIFF_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
