name: Bug report
description: Report incorrect behavior, a build failure, or a regression.
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small C++ example and the exact build commands.
      render: cpp
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include vardiff version or commit, OS, compiler version, CMake version, and build type.
    validations:
      required: true
